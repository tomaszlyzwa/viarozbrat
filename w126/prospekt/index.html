we, ramę tylnego siedzenia oraz liczne wzmocnienia i&nbsp;osłony. Podobnie pedał hamulca postojowego i&nbsp;obudowę lusterka zewnętrznego.</p></div>", "p12": "<div class=\"blk col fit\" style=\"left:9.320%;top:19.531%;width:39.571%;height:38.802%\"><p class=\"sub\">Mniejsza siła nośna</p><p>Zwłaszcza przy szybszej jeździe strumień powietrza wytwarza jednak pod samochodem także siły nośne. One również kosztują energię, a&nbsp;ponadto mogą pogarszać przyczepność samochodu. Mercedes-Benz rozwiązał ten problem dzięki klinowej sylwetce nadwozia i&nbsp;ukształtowaniu fartuchów zderzaków, sięgających głęboko pod samochód.</p><p>Dzięki zaokrągleniom, płynnym przejściom oraz łagodniej pochylonym szybom przedniej i&nbsp;tylnej cały kształt wytwarza na całej powierzchni mniejsze podciśnienie. Dzięki temu siły nośne udało się utrzymać na szczególnie niskim poziomie. Nisko poprowadzony przedni fartuch, zintegrowany ze zderzakiem, wytwarza pod podłogą podciśnienie, które jeszcze bardziej zmniejsza siłę nośną. Znacznie poprawia to stabilność jazdy.</p></div><div class=\"blk col fit\" style=\"left:9.467%;top:59.635%;width:39.571%;height:10.677%\"><p class=\"sub\">Drobiazgowa praca o&nbsp;wielkim efekcie</p><p>To, co w&nbsp;tunelu aerodynamicznym daje najlepsze wyniki, decyduje o&nbsp;kształcie. Ale to, co służy opływowości, a&nbsp;tym samym oszczędności energii, może przynieść także inne</p></div><div class=\"blk cap\" style=\"left:10.059%;top:92.448%;width:41.420%;height:1.302%\">Aerodynamicznie ukształtowane lusterko zewnętrzne, regulowane od wewnątrz.</div><div class=\"blk cap\" style=\"left:51.405%;top:40.417%;width:39.941%;height:1.302%\">Specjalnie ukształtowane rynny dachowe odpychające brud.</div><div class=\"blk col fit\" style=\"left:51.183%;top:42.812%;width:39.941%;height:48.333%\"><p class=\"ni\">korzyści. Tam, gdzie powietrze nie tworzy wirów, powstaje mniej szumów wiatru. To, co zintegrowane, zagłębione lub ukryte, obniża poziom hałasu, a&nbsp;często poprawia też wrażenie estetyczne. Spora część wizualnego uroku Nowej Klasy&nbsp;S wynika z&nbsp;nieprzerwanie płynących linii nadwozia.</p><p>W żmudnej, drobiazgowej pracy kolejne elementy usuwano z&nbsp;linii opływu lub optymalizowano aerodynamicznie, przy czym funkcje zintegrowanych elementów w&nbsp;większości przypadków jeszcze ulepszono:</p><p>W przednie słupki wbudowano osłony odprowadzające wodę, które zapobiegają brudzeniu się bocznych szyb. Przejścia od przednich słupków do ram okien są płynne, rynny dachowe przeniesiono do wewnątrz. Szczelina między nadwoziem a&nbsp;zderzakiem jest zamknięta. Gładkie osłony kół z&nbsp;poliamidu i&nbsp;bardziej pochylona szyba przednia również przyczyniają się do korzystnego aerodynamicznie kształtu całości. Nawet regulowane od wewnątrz lusterko zewnętrzne uwzględniono w&nbsp;kształtowaniu aerodynamicznym.</p></div>", "g5a": "<div class=\"blk title\" style=\"left:11.538%;top:7.292%;width:73.964%;height:6.771%\">Mercedes-Benz 280&nbsp;SE i&nbsp;280&nbsp;SEL.<br>Najwyższa sprawność przy wszechstronnej ekonomii.</div><div class=\"blk col fit big\" style=\"left:10.799%;top:61.719%;width:66.568%;height:35.156%\"><p class=\"ni\">Mercedes-Benz 280&nbsp;SE/SEL – dzięki znakomitej relacji osiągów do zużycia paliwa oraz całej swojej wartości użytkowej – jest typowym przedstawicielem Nowej Klasy&nbsp;S.</p><p>Elastyczny 6-cylindrowy silnik wtryskowy z&nbsp;dwoma wałkami rozrządu w&nbsp;głowicy ma moc 136&nbsp;kW (185&nbsp;KM) i&nbsp;zapewnia samochodowi szczególnie duże możliwości przyspieszania. Mimo to jego zużycie paliwa pozostaje na poziomie, jaki osiągają, a&nbsp;nawet przekraczają samochody o&nbsp;mniejszej mocy.</p><p>Wyposażenie techniczne nowego 280&nbsp;SE/SEL, jego jakość formalna, trwałość wartości i&nbsp;doskonała równowaga wszystkich poszczególnych właściwości sprawiły, że stał się on już pojęciem.</p></div>", "g2c": "", "p18": "", "g4c": "<div class=\"blk title\" style=\"left:9.320%;top:6.771%;width:85.059%;height:3.125%\">Mercedes-Benz 280 S. Dane techniczne.</div><div class=\"blk tech fit\" style=\"left:9.467%;top:19.531%;width:39.571%;height:34.375%\"><table class=\"t1\"><tr><td>Liczba cylindrów</td><td>6</td></tr><tr><td>Średnica / skok</td><td>86/78,8 mm</td></tr><tr><td>Pojemność skokowa</td><td>2746 cm³</td></tr><tr><td>Moc silnika wg DIN<sup>1)</sup></td><td>115 kW przy 5500 obr./min<br>156 KM przy 5500 obr./min</td></tr><tr><td>Maks. moment obrotowy wg DIN<sup>1)</sup></td><td>223 Nm przy 4000 obr./min<br>22,7 kGm przy 4000 obr./min</td></tr><tr><td>Stopień sprężania</td><td>9,0</td></tr><tr><td>Ilość oleju w skrzyni korbowej maks./min.</td><td>5,5/4,0 l</td></tr><tr><td>Pojemność układu chłodzenia</td><td>10,5 l</td></tr><tr><td>Alternator</td><td>14 V/65 A</td></tr><tr><td>Akumulator</td><td>12 V/55 Ah</td></tr><tr><td>Prędkość maksymalna</td><td>ok. 200 km/h</td></tr><tr><td>Opony</td><td>195/70 R 14 89 H</td></tr><tr><td>Paliwo</td><td>Super wg DIN 51 600</td></tr><tr class=\"fu\"><td colspan=\"2\"><table class=\"fuel\"><tr><td>Zużycie paliwa<br>wg DIN 70 030<sup>2)</sup></td><td></td><td>skrzynia<br>manualna</td><td><br>M 5</td><td>skrzynia<br>automat.</td></tr>\n<tr><td>w cyklu miejskim</td><td>l/100 km</td><td>14,5</td><td>14,5</td><td>14,3</td></tr>\n<tr><td>przy 90 km/h</td><td>l/100 km</td><td>8,9</td><td>8,0</td><td>9,2</td></tr>\n<tr><td>przy 120 km/h</td><td>l/100 km</td><td>10,9</td><td>9,9</td><td>11,5</td></tr></table></td></tr><tr><td>Pojemność zbiornika<br>w tym rezerwa</td><td>ok. 90 l<br>ok. 12,5 l</td></tr></table></div><div class=\"blk tech fit\" style=\"left:51.331%;top:19.531%;width:40.311%;height:34.375%\"><table class=\"t2\"><tr><td>A</td><td>Największa wysokość, gotowy do jazdy</td><td>1430 mm</td></tr><tr><td>B</td><td>Największa szerokość</td><td>1820 mm</td></tr><tr><td>C</td><td>Największa długość</td><td>4995 mm</td></tr><tr><td>D</td><td>Rozstaw osi</td><td>2935 mm</td></tr><tr><td>E</td><td>Kierownica – oparcie fotela kierowcy<sup>3)</sup></td><td>477 mm</td></tr><tr><td>F</td><td>Wysokość siedzenia z przodu<sup>4)</sup></td><td>979 mm</td></tr><tr><td>G</td><td>Oparcie kierowcy – oparcie tylne<sup>3)</sup></td><td>704 mm</td></tr><tr><td>H</td><td>Wysokość siedzenia z tyłu<sup>4)</sup></td><td>943 mm</td></tr><tr><td>J</td><td>Szerokość na wysokości bioder z przodu</td><td>1432 mm</td></tr><tr><td>K</td><td>Szerokość na wysokości ramion z przodu</td><td>1428 mm</td></tr><tr><td>L</td><td>Szerokość na wysokości bioder z tyłu</td><td>1468 mm</td></tr><tr><td>M</td><td>Szerokość na wysokości ramion z tyłu</td><td>1416 mm</td></tr><tr><td></td><td>Rozstaw kół z przodu</td><td>1545 mm</td></tr><tr><td></td><td>Rozstaw kół z tyłu</td><td>1517 mm</td></tr><tr><td></td><td>Średnica zawracania</td><td>ok. 11,80 m</td></tr><tr><td></td><td>Pojemność bagażnika (wg VDA)</td><td>ok. 505 l</td></tr><tr><td></td><td>Masa własna, gotowy do jazdy<sup>5)</sup></td><td>1560 kg</td></tr><tr><td></td><td>Dopuszczalna masa całkowita</td><td>2080 kg</td></tr><tr class=\"note\"><td colspan=\"4\">Masa przyczepy: przepisy dopuszczają różne możliwości, o których chętnie Państwa poinformujemy. Prosimy o zamówienie naszego specjalnego prospektu.</td></tr></table></div><div class=\"blk foot fit\" style=\"left:10.799%;top:84.479%;width:81.361%;height:10.417%\"><div><sup>1)</sup> Podana moc wg DIN jest mocą efektywnie dostępną do napędu po odliczeniu wszystkich urządzeń pomocniczych na sprzęgle.<br><sup>2)</sup> Zużycie paliwa wg DIN 70 030, część 1, wydanie z lipca 1978. Podane wartości zużycia paliwa ustalane są znormalizowaną metodą badawczą:</div><div>– na hamowni w cyklu jazdy, który symuluje ruch miejski;<br>– na równej, suchej drodze ze stałą prędkością próbną 90 km/h i 120 km/h.<br>Wartości te stanowią dla zainteresowanych podstawę do porównania</div><div>różnych typów samochodów. Zależnie od stylu jazdy, warunków drogowych i ruchu, wpływów otoczenia i stanu pojazdu w praktyce uzyskuje się wartości zużycia paliwa, które mogą odbiegać od wartości ustalonych według tej normy.<br><sup>3)</sup> Wymiary zmienne w zależności od położenia fotela.</div><div><sup>4)</sup> Bez dachu przesuwnego.<br><sup>5)</sup> Masa własna dotyczy samochodów w wyposażeniu seryjnym. Wyposażenie dodatkowe zwiększa tę wartość.<br><br>Dane zawarte w tym prospekcie należy traktować jako przybliżone.</div></div>", "p11": "<div class=\"blk title\" style=\"left:11.169%;top:6.146%;width:66.568%;height:4.948%\">Właściwy kształt dla większych osiągów przy mniejszym zużyciu.</div><div class=\"blk cap\" style=\"left:10.947%;top:58.333%;width:73.964%;height:1.250%\">Współczynnik oporu powietrza należy do najniższych wartości osiąganych dziś przez seryjne limuzyny.</div><div class=\"blk col fit\" style=\"left:10.207%;top:60.521%;width:39.201%;height:36.354%\"><p class=\"ni\">W tunelu aerodynamicznym można się nauczyć, jak nie stawiać wiatrowi oporu. Powietrze, które nie napotyka oporu samochodu, nie musi być bowiem pokonywane. A&nbsp;to kosztowałoby siłę, a&nbsp;więc i&nbsp;paliwo.</p><p>W Nowej Klasie&nbsp;S wykorzystano wszelkie możliwości zmniejszenia oporu powietrza. Wynikiem gruntownej pracy nad szczegółami jest wartość należąca do najniższych, jakie osiągają dziś seryjne limuzyny.</p><p>Z konieczności większy przekrój poprzeczny limuzyny podróżnej dla 5 osób został w&nbsp;dużej mierze skompensowany aerodynamiczną optymalizacją całego kształtu. Współczynnik oporu powietrza Nowej Klasy&nbsp;S jest o&nbsp;kolejne 14% niższy</p></div><div class=\"blk col fit\" style=\"left:52.589%;top:60.521%;width:39.571%;height:36.354%\"><p class=\"ni\">od wartości dla samochodów dotychczasowej Klasy&nbsp;S, którą już uważano za znakomitą.</p><p>Temu opływowemu kształtowi zawdzięczamy, że zużycie paliwa wyraźnie spada już od średnich prędkości.</p><p>Podczas gdy współczynnik oporu powietrza (Cx) większości seryjnych limuzyn wynosi dziś od 0,47 do 0,50, ta sama wartość dla doświadczalnego Mercedes-Benz C&nbsp;111, zbudowanego wyłącznie według praw aerodynamiki, wynosi niespełna 0,2. Najniższa osiągalna granica dla seryjnych limuzyn leży prawdopodobnie przy Cx = 0,3. Samochody Nowej Klasy&nbsp;S osiągnęły niezwykle korzystną wartość 0,36.</p></div>"}};
const S=D.spreads, GF=D.gf, N=S.length;
const PW=700, PH=990;
const book=document.getElementById('book'), cam=document.getElementById('cam');
let cur=0, unf=false, focus=0, zoom=1, pan={x:0,y:0}, busy=false;
const isPano=n=>D.pano.includes(n)||D.pano.includes(prevOf(n));
function prevOf(n){for(const s of S){if(s[1]===n)return s[0]}return null}
function mkPage(n,side,extra){
  const d=document.createElement('div');d.className='page '+side+(extra?' '+extra:'');
  if(!n){d.style.visibility='hidden';return d}
  if(D.pano.includes(n)||D.pano.includes(prevOf(n)))d.classList.add('pano');
  const im=document.createElement('img');im.className='bg';im.dataset.src=D.src[n];im.alt='';im.draggable=false;d.appendChild(im);
  d.insertAdjacentHTML('beforeend',D.html[n]||'');
  const g=document.createElement('div');g.className='gut';d.appendChild(g);
  const sh=document.createElement('div');sh.className='sh';d.appendChild(sh);
  d.dataset.name=n;return d;
}
// static base pages: inside of covers handled by leaves; base left = S[0].L (none), base right = last R (none)
const leaves=[];
for(let k=0;k<N-1;k++){
  const f=mkPage(S[k][1],'r','pg f'), b=mkPage(S[k+1][0],'l','pg b');
  f.style.display='none';b.style.display='none';
  book.append(f,b);leaves.push({f,b});
}
const gfs={};
for(const k in GF){
  const g=GF[k], box=document.createElement('div');box.className='gf';box.style.display='none';
  const [a,b,c]=g.p, L=S[k][0], R=S[k][1];
  let fade=null,F,Bk;
  if(g.dir==='R'){
    const pa=mkPage(a,'l');pa.style.left=(-PW)+'px';if(a!==L){pa.classList.add('fd','hide');fade=pa}
    const pb=mkPage(b,'r');pb.style.left='0px';
    F=mkPage(R,'r');F.style.left='0px';F.style.transformOrigin='100% 50%';
    Bk=mkPage(c,'l');Bk.style.left=PW+'px';Bk.style.transformOrigin='0 50%';
    box.append(pa,pb,F,Bk);
  }else{
    const pc=mkPage(c,'r');pc.style.left='0px';if(c!==R){pc.classList.add('fd','hide');fade=pc}
    const pb=mkPage(b,'l');pb.style.left=(-PW)+'px';
    F=mkPage(L,'l');F.style.left=(-PW)+'px';F.style.transformOrigin='0 50%';
    Bk=mkPage(a,'r');Bk.style.left=(-2*PW)+'px';Bk.style.transformOrigin='100% 50%';
    box.append(pb,pc,F,Bk);
  }
  Bk.style.display='none';
  book.appendChild(box);gfs[k]={box,F,Bk,dir:g.dir,fade};
}
const raf=()=>new Promise(r=>requestAnimationFrame(()=>requestAnimationFrame(r)));
async function swing(out,outTo,inn,inFrom,dur){
  const sOut=out.querySelector('.sh'),sIn=inn.querySelector('.sh');
  out.style.transition=`transform ${dur}ms cubic-bezier(.45,0,.85,.55)`;
  if(sOut){sOut.style.transition=`opacity ${dur}ms ease-in`;sOut.style.opacity=.75}
  out.style.transform=`rotateY(${outTo}deg)`;
  await wait(dur);
  out.style.display='none';out.style.transition='none';out.style.transform='';if(sOut){sOut.style.transition='none';sOut.style.opacity=0}
  inn.style.transition='none';inn.style.transform=`rotateY(${inFrom}deg)`;if(sIn){sIn.style.transition='none';sIn.style.opacity=.75}
  inn.style.display='';await raf();
  inn.style.transition=`transform ${dur}ms cubic-bezier(.15,.45,.55,1)`;inn.style.transform='rotateY(0deg)';
  if(sIn){sIn.style.transition=`opacity ${dur}ms ease-out`;sIn.style.opacity=0}
  await wait(dur);inn.style.transition='none';
}
function z(){leaves.forEach((l,k)=>{l.f.style.display=k===cur?'':'none';l.b.style.display=k===cur-1?'':'none';
  [l.f,l.b].forEach(e=>{e.style.transition='none';e.style.transform='';e.style.zIndex=10})})}
function setImg(el,on){el.querySelectorAll('img.bg').forEach(im=>{if(on){if(im.dataset.src){im.src=im.dataset.src;im.removeAttribute('data-src')}}else if(im.getAttribute('src')){im.dataset.src=im.getAttribute('src');im.removeAttribute('src')}})}
function load(i){
  leaves.forEach((l,k)=>{const on=k>=i-3&&k<=i+2;setImg(l.f,on);setImg(l.b,on)});
  for(const k in gfs)setImg(gfs[k].box,Math.abs(k-i)<=1);
}
function slots(){
  if(unf){return GF[cur].dir==='R'?[-1,0,1]:[-2,-1,0]}
  const s=[];if(S[cur][0])s.push(-1);if(S[cur][1])s.push(0);return s;
}
function portrait(){return innerWidth/innerHeight<0.95}
function layout(){
  const sl=slots(), TOP=46, BOT=64, vw=innerWidth, vh=innerHeight-TOP-BOT;
  let x0,x1;
  if(portrait()){const f=sl[Math.min(focus,sl.length-1)];x0=f;x1=f+1}
  else{x0=Math.min(...sl);x1=Math.max(...sl)+1}
  const w=(x1-x0)*PW, sc=Math.min(vw*0.99/w,vh*0.99/PH)*zoom;
  const cx=(x0+x1)/2*PW;
  cam.style.transform=`translate(${pan.x}px,${pan.y+(TOP-BOT)/2}px) scale(${sc}) translateX(${-cx}px)`;
  // stack edges & shadow
  const left=cur, right=N-1-cur;
  const eL=document.getElementById('edgeL'),eR=document.getElementById('edgeR');
  const closed=cur===0||cur===N-1;eL.style.width=(!closed&&S[cur][0]?Math.min(10,left*0.45)+'px':'0');eR.style.width=(!closed&&S[cur][1]?Math.min(10,right*0.45)+'px':'0');
  eL.style.opacity=unf&&GF[cur].dir==='L'?0:1;eR.style.opacity=unf&&GF[cur].dir==='R'?0:1;
  const sh=document.getElementById('shadow');sh.style.left=(Math.min(...sl)*PW)+'px';sh.style.width=((Math.max(...sl)+1-Math.min(...sl))*PW)+'px';
  ui();
}
function pageLabel(){
  const n=(cur===0)?'Okładka':(cur===N-1)?'Tył okładki':('Strony '+(cur*2-1)+'–'+(cur*2));
  return unf?n+' · wklejka':n;
}
function ui(){
  document.getElementById('pg').textContent=pageLabel();
  const r=document.getElementById('range');r.max=N-1;r.value=cur;
  const g=document.getElementById('bGf');g.style.display=GF[cur]?'':'none';g.textContent=unf?'Złóż':'Rozłóż';g.classList.toggle('hl',!!GF[cur]&&!unf);
  document.getElementById('bPrev').disabled=cur===0&&!unf&&focus===0;
  const sl=slots();document.getElementById('bNext').disabled=cur===N-1&&(!portrait()||focus>=sl.length-1);
}
function wait(ms){return new Promise(r=>setTimeout(r,ms))}
async function setUnf(v){
  if(!GF[cur]||unf===v)return;
  const g=gfs[cur];busy=true;const R=g.dir==='R';
  if(v){g.box.style.display='';load(cur);await readyEl([g.box]);
    unf=true;focus=1;layout();
    if(g.fade)g.fade.classList.remove('hide');
    await swing(g.F,R?90:-90,g.Bk,R?-90:90,520);
  }else{
    unf=false;focus=R?(S[cur][0]?1:0):0;layout();
    if(g.fade)g.fade.classList.add('hide');
    await swing(g.Bk,R?-90:90,g.F,R?90:-90,520);
    g.box.style.display='none';
  }
  busy=false;
}
function readyEl(els){const ims=[];els.forEach(e=>e&&e.querySelectorAll('img.bg').forEach(im=>{if(im.getAttribute('src')&&im.decode)ims.push(im.decode().catch(()=>{}))}));return Promise.race([Promise.all(ims),wait(700)])}
async function flipTo(t,instant){
  if(t<0||t>N-1||t===cur)return;
  if(unf)await setUnf(false);
  busy=true;load(t);
  const fwd=t>cur;
  if(instant||Math.abs(t-cur)>1){
    await readyEl([leaves[t]&&leaves[t].f,leaves[t-1]&&leaves[t-1].b]);
    cur=t;z();focus=fwd?0:slots().length-1;cam.classList.add('fast');layout();
    await wait(350);cam.classList.remove('fast');busy=false;return;
  }
  if(fwd){
    const L=leaves[cur],under=leaves[cur+1];
    await readyEl([L.f,L.b,under&&under.f]);
    if(under){under.f.style.zIndex=5;under.f.style.display=''}
    L.f.style.zIndex=50;L.b.style.zIndex=50;
    cur=t;focus=0;layout();
    await swing(L.f,-90,L.b,90,480);
  }else{
    const L=leaves[cur-1],under=leaves[cur-2];
    await readyEl([L.f,L.b,under&&under.b]);
    if(under){under.b.style.zIndex=5;under.b.style.display=''}
    L.f.style.zIndex=50;L.b.style.zIndex=50;
    cur=t;focus=slots().length-1;layout();
    await swing(L.b,90,L.f,-90,480);
  }
  z();busy=false;
}
async function next(){
  if(busy)return;const sl=slots();
  if(portrait()&&focus<sl.length-1){focus++;layout();return}
  if(GF[cur]&&!unf){await setUnf(true);return}
  if(cur<N-1)await flipTo(cur+1);
}
async function prev(){
  if(busy)return;
  if(portrait()&&focus>0){focus--;layout();return}
  if(unf){await setUnf(false);if(portrait()){focus=slots().length-1;layout()}return}
  if(cur>0)await flipTo(cur-1);
}
// fit text
function fit(){
  document.querySelectorAll('.page').forEach(p=>{
    const bl=[...p.querySelectorAll('.fit')];if(!bl.length)return;
    let s=1;
    const over=()=>bl.some(b=>b.scrollHeight>b.clientHeight+1);
    p.style.setProperty('--s',s);
    while(over()&&s>0.78){s-=0.01;bl.forEach(b=>b.style.setProperty('--s',s))}
    bl.forEach(b=>b.style.setProperty('--s',s));
  });
}
// input
document.getElementById('bNext').onclick=e=>{e.stopPropagation();next()};
document.getElementById('bPrev').onclick=e=>{e.stopPropagation();prev()};
document.getElementById('bGf').onclick=e=>{e.stopPropagation();if(!busy)setUnf(!unf)};
document.getElementById('range').oninput=e=>{flipTo(+e.target.value)};
document.getElementById('bZoom').onclick=e=>{e.stopPropagation();zoom=zoom>1?1:2.2;pan={x:0,y:0};layout()};
document.getElementById('bFs').onclick=e=>{e.stopPropagation();const d=document.documentElement;if(!document.fullscreenElement)(d.requestFullscreen||d.webkitRequestFullscreen||(()=>{})).call(d);else document.exitFullscreen()};
addEventListener('keydown',e=>{if(e.key==='ArrowRight'||e.key===' '||e.key==='PageDown'){e.preventDefault();next()}else if(e.key==='ArrowLeft'||e.key==='PageUp'){e.preventDefault();prev()}else if(e.key==='Escape'&&zoom>1){zoom=1;pan={x:0,y:0};layout()}else if(e.key==='Home')flipTo(0);else if(e.key==='End')flipTo(N-1)});
const stage=document.getElementById('stage');let st=null;
stage.addEventListener('pointerdown',e=>{st={x:e.clientX,y:e.clientY,t:Date.now(),px:pan.x,py:pan.y};if(zoom>1)cam.classList.add('nt')});
stage.addEventListener('pointermove',e=>{if(!st||zoom<=1)return;pan.x=st.px+e.clientX-st.x;pan.y=st.py+e.clientY-st.y;layout()});
stage.addEventListener('pointerup',e=>{if(!st)return;const dx=e.clientX-st.x,dy=e.clientY-st.y,dt=Date.now()-st.t;cam.classList.remove('nt');
  if(zoom>1){if(Math.abs(dx)+Math.abs(dy)<8&&dt<300){}st=null;return}
  if(Math.abs(dx)>40&&Math.abs(dx)>Math.abs(dy)){dx<0?next():prev()}
  else if(Math.abs(dx)<10&&Math.abs(dy)<10){e.clientX>innerWidth/2?next():prev()}
  st=null;hideHint()});
